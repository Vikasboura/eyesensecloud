; EyeSense Portal — PHP configuration overrides
; This file is picked up by the PHP built-in server (-t api) and most web servers.

; ── Extensions (copy critical ones from system php.ini so -c doesn't strip them) ──
extension_dir = "C:\php\ext"
extension = pdo_mysql
extension = mbstring
extension = openssl
extension = zip


; ── File Upload Limits ──
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 5

; ── Execution & Memory ──
max_execution_time = 60
memory_limit = 128M

; ── Error handling (disable on production, enable for dev) ──
display_errors = on
log_errors = On
